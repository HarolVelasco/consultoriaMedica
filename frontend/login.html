<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar sesión | Consultoría Médica</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <nav class="navbar">
    <div class="nav-container">
      <a href="/" class="logo">🩺 Consultoría Médica</a>
      <ul class="nav-links">
        <li><a href="/registro">Registrarse</a></li>
      </ul>
    </div>
  </nav>

  <div class="auth-wrap">
    <div class="card">
      <h1 class="card-title">Iniciar sesión</h1>
      <p class="card-sub">Accede a tu panel y gestiona tus citas.</p>

      <div id="alert" class="alert"></div>

      <form id="loginForm">
        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" required placeholder="tu@email.com" autocomplete="email">
        </div>
        <div class="form-group">
          <label for="password">Contraseña</label>
          <input type="password" id="password" required minlength="6" autocomplete="current-password">
        </div>
        <button type="submit" class="btn btn-primary btn-block" id="btnSubmit">Entrar</button>
      </form>

      <p style="margin-top:1.25rem;text-align:center;font-size:0.9rem;color:#64748b;">
        ¿No tienes cuenta? <a href="/registro">Regístrate</a>
      </p>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script>
    if (getToken()) window.location.href = "/panel";

    const form = document.getElementById("loginForm");
    const alertEl = document.getElementById("alert");
    const btn = document.getElementById("btnSubmit");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      alertEl.className = "alert";
      btn.disabled = true;
      btn.textContent = "Entrando...";
      try {
        await login(form.email.value.trim(), form.password.value);
        window.location.href = "/panel";
      } catch (err) {
        alertEl.textContent = err.message;
        alertEl.className = "alert alert-error show";
      } finally {
        btn.disabled = false;
        btn.textContent = "Entrar";
      }
    });
  </script>
</body>
</html>
